# project_RRM ver_2 conda environment
# Install:  conda env create -f project_RRM/environment_v2.yml
# Activate: conda activate allatom_v2
#
# 与根目录的 environment.yml（app/ 用的）独立，名字不同避免冲突。
# 与 ver_1 的 allatom 也独立，确保 ver_1 重现性。

name: allatom_v2

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # MD engine
  - openmm>=8.1
  # cuda-version pin only matters on the server; on Windows it's auto-detected.
  # If installing on the server, also: module load cuda/12.5
  - openmmforcefields>=0.12

  # Structure preparation + AMBER prmtop pipeline
  - pdbfixer
  - parmed
  # ambertools = tleap + cpptraj + sander (and more); LINUX-ONLY package.
  # On Windows this line is silently a no-op; conda will skip it.
  # On the cluster (Linux) this is what enables the prmtop route.
  - ambertools>=24

  # Trajectory analysis
  - mdanalysis>=2.7
  - mdtraj>=1.9

  # Numerics
  - numpy
  - scipy
  - pandas

  # Visualization
  - matplotlib
  - nglview
  - jupyterlab
  - ipywidgets

  # Remote transfer
  - paramiko
  - fabric

  # Utilities
  - tqdm
  - rich
  - pyyaml
  - click

  # Dev tools
  - pytest
  - black
  - pip

  # BioPython is needed by ptm_builder.py for PDB parsing
  - biopython

  # Optional future: self-derived RESP via Psi4 + PsiRESP
  # - psi4
  # - pip:
  #     - psiresp
